[server]
enableStaticServing = true

[theme]
baseFontSize = 17

[[theme.fontFaces]]
family = "ComicNeue"
url = "app/static/ComicNeue-Regular.ttf"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "ComicNeue"
url = "app/static/ComicNeue-Bold.ttf"
style = "normal"
weight = 700

[[theme.fontFaces]]
family = "Fredoka"
url = "app/static/Fredoka-Regular.ttf"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "SourceCodePro"
url = "app/static/SourceCodePro-Regular.ttf"
style = "normal"
weight = 400

# Catppuccin Latte (light) + Macchiato (dark), accent mauve
# Streamlit follows the OS setting, or Settings -> Theme.

